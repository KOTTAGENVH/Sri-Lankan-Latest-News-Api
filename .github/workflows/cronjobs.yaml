name: Run News Cron Jobs

on:
  schedule:
    - cron: "30 18 * * *" # 18:30 UTC = 12:00 AM IST
  workflow_dispatch:

jobs:
  run-crons:
    runs-on: ubuntu-latest

    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Run Lankadeepa Cron
        run: curl -fsS "https://lankanewsapi.nowenkottage.com/cronjob/v1/lankadeepa?cron_secret=$CRON_SECRET"

      - name: Run Deshaya Cron
        run: curl -fsS "https://lankanewsapi.nowenkottage.com/cronjob/v1/deshaya?cron_secret=$CRON_SECRET"

      - name: Run BBC Sinhala Cron
        run: curl -fsS "https://lankanewsapi.nowenkottage.com/cronjob/v1/bbcsinhala?cron_secret=$CRON_SECRET"

      - name: Run NewsWire Cron
        run: curl -fsS "https://lankanewsapi.nowenkottage.com/cronjob/v1/newswire?cron_secret=$CRON_SECRET"

      - name: Run NewsFirst Tamil Cron
        run: curl -fsS "https://lankanewsapi.nowenkottage.com/cronjob/v1/newsfirsttamil?cron_secret=$CRON_SECRET"

      - name: Run AdaDerana Cron
        run: curl -fsS "https://lankanewsapi.nowenkottage.com/cronjob/v1/adaderana?cron_secret=$CRON_SECRET"

      - name: Run MongoDB Storage Cleanup
        run: curl -fsS "https://lankanewsapi.nowenkottage.com/cronjob/v1/storageStatus?cron_secret=$CRON_SECRET"
