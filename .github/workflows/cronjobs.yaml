name: Cron Jobs

on:
  schedule:
    - cron: '0 * * * *' # hourly, on the hour
  workflow_dispatch:

permissions: {}

concurrency:
  group: cron-jobs
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      API_KEY: ${{ secrets.API_KEY }}
      BASE: https://lankanewsapi.nowenkottage.com/cronjob/v1

    steps:
      - name: Lankadeepa
        if: always()
        run: |
          curl -fsS --max-time 120 -H "Authorization: Bearer $API_KEY" \
            "$BASE/lankadeepa" | tee /dev/stderr | jq -e '.saved != null'

      - name: BBC Sinhala
        if: always()
        run: |
          curl -fsS --max-time 120 -H "Authorization: Bearer $API_KEY" \
            "$BASE/bbcsinhala" | tee /dev/stderr | jq -e '.saved != null'

      - name: NewsWire
        if: always()
        run: |
          curl -fsS --max-time 120 -H "Authorization: Bearer $API_KEY" \
            "$BASE/newswire" | tee /dev/stderr | jq -e '.saved != null'

      - name: AdaDerana
        if: always()
        run: |
          curl -fsS --max-time 120 -H "Authorization: Bearer $API_KEY" \
            "$BASE/adaderana" | tee /dev/stderr | jq -e '.saved != null'

      - name: NewsFirst Tamil
        if: always()
        run: |
          curl -fsS --max-time 120 -H "Authorization: Bearer $API_KEY" \
            "$BASE/newsfirsttamil" | tee /dev/stderr | jq -e '.saved != null'

      - name: UN News
        if: always()
        run: |
          curl -fsS --max-time 120 -H "Authorization: Bearer $API_KEY" \
            "$BASE/un" | tee /dev/stderr | jq -e '.saved != null'

      - name: IRD News
        if: always()
        run: |
          curl -fsS --max-time 180 -H "Authorization: Bearer $API_KEY" \
            "$BASE/ird/news" | tee /dev/stderr | jq -e '.saved != null'

      - name: IRD Content
        if: always()
        run: |
          curl -fsS --max-time 180 -H "Authorization: Bearer $API_KEY" \
            "$BASE/ird/content" | tee /dev/stderr | jq -e '.saved != null'

      - name: CISA KEV
        if: always()
        run: |
          curl -fsS --max-time 180 -H "Authorization: Bearer $API_KEY" \
            "$BASE/cyber/kev" | tee /dev/stderr | jq -e '.saved != null'

      - name: EUVD latest
        if: always()
        run: |
          curl -fsS --max-time 180 -H "Authorization: Bearer $API_KEY" \
            "$BASE/cyber/euvd/latest" | tee /dev/stderr | jq -e '.saved != null'
          sleep 5

      - name: EUVD critical
        if: always()
        run: |
          curl -fsS --max-time 180 -H "Authorization: Bearer $API_KEY" \
            "$BASE/cyber/euvd/critical" | tee /dev/stderr | jq -e '.saved != null'
          sleep 5

      - name: EUVD exploited
        if: always()
        run: |
          curl -fsS --max-time 180 -H "Authorization: Bearer $API_KEY" \
            "$BASE/cyber/euvd/exploited" | tee /dev/stderr | jq -e '.saved != null'

      - name: Merged cyber feed
        if: always()
        run: |
          curl -fsS --max-time 180 -H "Authorization: Bearer $API_KEY" \
            "$BASE/cyber" | tee /dev/stderr | jq -e '.saved != null'

      - name: Storage status
        if: always()
        run: |
          curl -fsS --max-time 60 -H "Authorization: Bearer $API_KEY" \
            "$BASE/storageStatus" | tee /dev/stderr | jq -e '.status != "error"'
