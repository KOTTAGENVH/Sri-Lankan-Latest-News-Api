name: Run News Cron Jobs

on:
  schedule:
    - cron: "30 18 * * *" # 18:30 UTC = 12:00 AM IST
  workflow_dispatch:

jobs:
  run-crons:
    runs-on: ubuntu-latest

    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Run All Crons with Retry
        run: |
          retry() {
            local url=$1
            for i in {1..10}; do
              echo "Attempt $i → $url"
              if curl -fsS "$url"; then
                return 0
              fi
              sleep 5
            done
            echo "Failed after 10 attempts: $url"
            return 1
          }

          retry "https://lankanewsapi.nowenkottage.com/cronjob/v1/lankadeepa?cron_secret=$CRON_SECRET"
          retry "https://lankanewsapi.nowenkottage.com/cronjob/v1/deshaya?cron_secret=$CRON_SECRET"
          retry "https://lankanewsapi.nowenkottage.com/cronjob/v1/bbcsinhala?cron_secret=$CRON_SECRET"
          retry "https://lankanewsapi.nowenkottage.com/cronjob/v1/newswire?cron_secret=$CRON_SECRET"
          retry "https://lankanewsapi.nowenkottage.com/cronjob/v1/newsfirsttamil?cron_secret=$CRON_SECRET"
          retry "https://lankanewsapi.nowenkottage.com/cronjob/v1/adaderana?cron_secret=$CRON_SECRET"
          retry "https://lankanewsapi.nowenkottage.com/cronjob/v1/storageStatus?cron_secret=$CRON_SECRET"

