name: Cron Jobs

on:
  schedule:
    - cron: '0 * * * *' # hourly, on the hour
  workflow_dispatch:

permissions: {}

concurrency:
  group: cron-jobs
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      API_KEY: ${{ secrets.API_KEY }}
      BASE: https://lankanewsapi.nowenkottage.com/cronjob/v1/1/1

    steps:
      - name: Ingest news sources
        run: |
          set -uo pipefail
          failed=()

          for path in \
            /lankadeepa \
            /bbcsinhala \
            /newswire \
            /adaderana \
            /newsfirsttamil \
            /un
          do
            echo "::group::$path"
            if curl -fsS --max-time 120 \
                 -H "Authorization: Bearer $API_KEY" \
                 "$BASE$path"
            then
              echo ""
              echo "ok"
            else
              echo "FAILED"
              failed+=("$path")
            fi
            echo "::endgroup::"
            sleep 2
          done

          if [ ${#failed[@]} -ne 0 ]; then
            echo "::error::news ingest failed: ${failed[*]}"
            exit 1
          fi

      - name: Ingest IRD
        if: always()
        run: |
          set -uo pipefail
          failed=()

          for path in /ird/news /ird/content; do
            echo "::group::$path"
            if curl -fsS --max-time 180 \
                 -H "Authorization: Bearer $API_KEY" \
                 "$BASE$path"
            then
              echo ""
              echo "ok"
            else
              echo "FAILED"
              failed+=("$path")
            fi
            echo "::endgroup::"
            sleep 2
          done

          if [ ${#failed[@]} -ne 0 ]; then
            echo "::error::IRD ingest failed: ${failed[*]}"
            exit 1
          fi

      - name: Ingest vulnerability sources
        if: always()
        run: |
          set -uo pipefail
          failed=()

          for path in \
            /cyber/kev \
            /cyber/euvd/latest \
            /cyber/euvd/critical \
            /cyber/euvd/exploited
          do
            echo "::group::$path"
            if curl -fsS --max-time 180 \
                 -H "Authorization: Bearer $API_KEY" \
                 "$BASE$path"
            then
              echo ""
              echo "ok"
            else
              echo "FAILED"
              failed+=("$path")
            fi
            echo "::endgroup::"
            sleep 5 # EUVD is rate-sensitive
          done

          if [ ${#failed[@]} -ne 0 ]; then
            echo "::error::vuln ingest failed: ${failed[*]}"
            exit 1
          fi

      - name: Ingest merged cyber feed
        if: always()
        run: |
          curl -fsS --max-time 180 \
            -H "Authorization: Bearer $API_KEY" \
            "$BASE/cyber"

      - name: Storage status
        if: always()
        run: |
          curl -fsS --max-time 60 \
            -H "Authorization: Bearer $API_KEY" \
            "$BASE/storageStatus"
