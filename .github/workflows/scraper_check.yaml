name: Scraper Health Check

on:
  schedule:
    - cron: '30 18 * * *' # 18:30 UTC = 12:00 AM IST
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest

    env:
      API_KEY: ${{ secrets.API_KEY }}
      BASE: https://lankanewsapi.nowenkottage.com/latest-news

    steps:
      - name: Check Lankadeepa
        run: |
          curl -fs -H "Authorization: Bearer $API_KEY" \
            "$BASE/lankadepa/v1/1" \
          | jq -e '(.latestContent // []) | length > 0'

      - name: Check BBC Sinhala
        run: |
          curl -fs -H "Authorization: Bearer $API_KEY" \
            "$BASE/bbcsinhala/v1/3" \
          | jq -e '(.latestContent // []) | length > 0'

      - name: Check NewsFirst Tamil
        run: |
          curl -fs -H "Authorization: Bearer $API_KEY" \
            "$BASE/newsfirsttamil/v1" \
          | jq -e '(.latestContent.latest // []) | length > 0'

      - name: Check NewsWire
        run: |
          curl -fs -H "Authorization: Bearer $API_KEY" \
            "$BASE/newswire/v1" \
          | jq -e '(.latestContent.latest // []) | length > 0'

      - name: Check AdaDerana feed
        run: |
          curl -fs -H "Authorization: Bearer $API_KEY" \
            "$BASE/adaderana/v1" \
          | jq -e '(.latestContent.all // []) | length > 0'

      - name: Check AdaDerana enrichment
        run: |
          curl -fs -H "Authorization: Bearer $API_KEY" \
            "$BASE/adaderana/v1" \
          | jq -e '[.latestContent.all[] | select(.image != null)] | length > 0'

      - name: Check Attribution block
        run: |
          curl -fs -H "Authorization: Bearer $API_KEY" \
            "$BASE/adaderana/v1" \
          | jq -e '.attribution | (.source != null) and (.legal != null) and (.retrievedAt != null)'

      - name: Check UN News
        run: |
          curl -fs --max-time 60 -H "Authorization: Bearer $API_KEY" \
            "$BASE/un/v1" \
          | jq -e '(.latestContent // []) | length > 0'

      - name: Check UN News region
        run: |
          curl -fs --max-time 60 -H "Authorization: Bearer $API_KEY" \
            "$BASE/un/v1/asia" \
          | jq -e '(.latestContent // []) | length > 0'

      - name: Check Wiki Events
        run: |
          curl -fs --max-time 60 -H "Authorization: Bearer $API_KEY" \
            "$BASE/wiki/events/v1" \
          | jq -e '(.latestContent.sections // []) | length > 0'

      - name: Check Wiki Guide
        run: |
          curl -fs --max-time 60 -H "Authorization: Bearer $API_KEY" \
            "$BASE/wiki/guide/v1/Sri_Lanka" \
          | jq -e '.latestContent.title != null'

      - name: Check IRD News
        run: |
          curl -fs --max-time 60 -H "Authorization: Bearer $API_KEY" \
            "$BASE/ird/news/v1" \
          | jq -e '(.latestContent // []) | length > 0'

      - name: Check IRD Content
        run: |
          curl -fs --max-time 60 -H "Authorization: Bearer $API_KEY" \
            "$BASE/ird/content/v1" \
          | jq -e '(.latestContent // []) | length > 0'

      - name: Check CISA KEV
        run: |
          curl -fs --max-time 60 -H "Authorization: Bearer $API_KEY" \
            "$BASE/cyber/kev/v1?limit=5" \
          | jq -e '(.latestContent // []) | length > 0'

      - name: Check KEV field shape
        run: |
          curl -fs --max-time 60 -H "Authorization: Bearer $API_KEY" \
            "$BASE/cyber/kev/v1?limit=1" \
          | jq -e '.latestContent[0] | (.cveId != null) and (.link != null) and (.kevDateAdded != null)'

      - name: Check EUVD Latest
        run: |
          curl -fs --max-time 60 -H "Authorization: Bearer $API_KEY" \
            "$BASE/cyber/euvd/v1/latest" \
          | jq -e '(.latestContent // []) | length > 0'

      - name: Check EUVD Critical
        run: |
          curl -fs --max-time 60 -H "Authorization: Bearer $API_KEY" \
            "$BASE/cyber/euvd/v1/critical" \
          | jq -e '(.latestContent // []) | length > 0'

      - name: Check EUVD Search
        run: |
          curl -fs --max-time 60 -H "Authorization: Bearer $API_KEY" \
            "$BASE/cyber/euvd/search/v1?text=apache&size=5" \
          | jq -e '.latestContent != null'

      - name: Check NVD lookup
        run: |
          curl -fs --max-time 60 -H "Authorization: Bearer $API_KEY" \
            "$BASE/cyber/nvd/v1/CVE-2021-44228" \
          | jq -e '.latestContent.cvss.score != null'

      - name: Check Merged Vuln Feed
        run: |
          curl -fs --max-time 30 -H "Authorization: Bearer $API_KEY" \
            "$BASE/cyber/vulns/v1?limit=10" \
          | jq -e '(.latestContent // []) | length > 0'

      - name: Check Cyber Stats
        run: |
          curl -fs --max-time 30 -H "Authorization: Bearer $API_KEY" \
            "$BASE/cyber/stats/v1" \
          | jq -e '(.latestContent.total // 0) > 0'

      - name: Check input validation
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $API_KEY" \
            "$BASE/cyber/euvd/v1/nonsense")
          test "$code" = "400"